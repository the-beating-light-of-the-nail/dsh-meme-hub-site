name: Update Screenshots & Discovery

# 每天定时四件事:
#   ① 重跑 fetch-screenshots.mjs,刷新 public/data/plugins.json 的 screenshots 字段
#   ② 跑 fetch-readmes.mjs,全量抓仓库 README 落盘 public/readmes/(正文图片钉死
#      commit SHA 防裂;只读 plugins.json 不改写,失败清单写 data/readme-failures.json)
#   ③ 跑 refresh-stars.py,原地刷新 stars/pushed_at/license/topics 等仓库元数据
#      (注意:不能用 build-data.py --enrich —— 它从 /root/china-ai-arbitrage 外部源
#       整体重建文件,runner 上无此路径必崩,且会丢 screenshots/image_w 等下游字段)
#   ④ 跑 discover-plugins.mjs,生成新插件「提名」清单 data/discovery/candidates.json
#      (提名 ≠ 收录:候选仅供人工/AI 审核,收录仍走既有数据源流程)
#   ⑤ IndexNow 全量提交 sitemap:数据刷新→commit→Vercel 部署后,次日把
#      sitemap 全部 URL 重新推给搜索引擎,保证新增/变更详情页尽快被收录
# 前四个脚本都幂等/失败不写文件 —— git diff 有变化才 commit 回 master（部署走
# Cloudflare wrangler 直传,不随 push 自动）,无变化不产生空提交。

on:
  schedule:
    - cron: '17 2 * * *' # 02:17 UTC = 10:17 北京时间,错开 GitHub 整点高峰
  workflow_dispatch:

concurrency:
  group: update-screenshots
  cancel-in-progress: false

permissions:
  contents: write # 允许 GITHUB_TOKEN push 回 master

jobs:
  update:
    # 只在正式仓运行（已迁回 the-beating-light-of-the-nail/dsh-meme-hub-site）
    if: github.repository == 'the-beating-light-of-the-nail/dsh-meme-hub-site'
    runs-on: ubuntu-latest
    timeout-minutes: 45 # 批1起全量抓 1800+ 仓 README,30 分钟余量不够
    env:
      GITHUB_DIRECT: '1' # runner 直连 GitHub,不走本机 sing-box 代理
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Refresh screenshots (fetch-screenshots.mjs)
        run: node scripts/fetch-screenshots.mjs
        # 只用 git ls-remote + raw.githubusercontent,不占 API 配额,无需 token

      - name: Fetch repo READMEs (fetch-readmes.mjs)
        run: node scripts/fetch-readmes.mjs
        # 全量抓 README 落 public/readmes/,同样只走 ls-remote + raw,不占 API 配额;
        # 单仓失败不中断,只记 data/readme-failures.json

      - name: Refresh stars & repo metadata (refresh-stars.py, in-place)
        run: python3 scripts/refresh-stars.py
        # 原地刷新已提交的 plugins.json(101 仓 × 2 次 API 调用,带 token 走 5000/h 配额);
        # 整体失败 exit 1 不写文件 → 本 job 失败、不 commit,数据不会被清空
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Discover plugin candidates (discover-plugins.mjs, nomination only)
        run: node scripts/discover-plugins.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # 搜索接口带 token 30 次/分(匿名 10 次/分)

      - name: Commit & push if changed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/data/plugins.json public/readmes data/readme-failures.json data/discovery/candidates.json
          if git diff --cached --quiet; then
            echo '截图、README 与候选均无变化,跳过提交'
          else
            git commit -m 'chore(data): auto refresh screenshots + readmes + discovery candidates'
            git push
          fi

      # ⑤ IndexNow:向搜索引擎全量提交 sitemap URL(昨日的部署此刻已上线,今天的数据
      # 刚推走,明日再推一轮——收录管道闭环)。引擎侧故障不能阻塞数据管道,失败仅告警。
      - name: IndexNow ping (sitemap)
        run: node scripts/indexnow.mjs sitemap
        continue-on-error: true
